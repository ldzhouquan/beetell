name: BeeTell
options:
  bundleIdPrefix: com.beetell
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    CODE_SIGN_STYLE: Automatic
targets:
  BeeTellWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beetell.watch
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: BeeTell
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.beetell.companion
        WKBackgroundModes: [audio]
        NSMicrophoneUsageDescription: BeeTell records speech and meetings when you start recording.
        NSLocalNetworkUsageDescription: Connect to your BeeTell gateway.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  BeeTellCompanion:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Phone
    dependencies:
      - target: BeeTellWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beetell.companion
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: BeeTell
        NSCameraUsageDescription: Scan a BeeTell gateway pairing QR code.
        NSLocalNetworkUsageDescription: Verify your BeeTell gateway and retrieve minutes.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [beetell]
