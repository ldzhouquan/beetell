[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beetell"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27,<1", "PyYAML>=6,<7", "qrcode>=7.4,<9"]

[project.optional-dependencies]
asr = ["faster-whisper>=1,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
btell = "btell.cli:main"

[tool.setuptools.packages.find]
include = ["btell*"]
